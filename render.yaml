services:
  - type: web
    name: commissioner-command-api
    runtime: node
    buildCommand: npm install
    startCommand: NODE_ENV=production npx tsx server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://statchasers.com,https://commissioner-command.pages.dev
      - key: DATABASE_URL
        fromDatabase:
          name: commissioner-command-db
          property: connectionString

databases:
  - name: commissioner-command-db
    plan: free
